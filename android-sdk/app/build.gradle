apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

android {
    namespace "com.example.expensetracker"
    compileSdkVersion 34

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId "com.example.expensetracker"
        minSdkVersion 21
        targetSdkVersion 34
        versionCode 2
        versionName "1.0"

        // BASE_URL is read from gradle property or environment variable at build time.
        // Pass with: ./gradlew assembleDebug -PWEB_BASE_URL=https://your-deployment.com
        def webBaseUrl = project.findProperty('WEB_BASE_URL')
            ?: System.getenv('WEB_BASE_URL')
            ?: "https://expense-tracker-app-two-zeta.vercel.app"
        buildConfigField "String", "BASE_URL", "\"${webBaseUrl}\""
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:1.8.20"
    implementation "androidx.appcompat:appcompat:1.6.1"
    implementation "androidx.core:core-ktx:1.10.1"
    implementation "com.google.android.material:material:1.9.0"
    implementation "androidx.constraintlayout:constraintlayout:2.1.4"
    implementation "androidx.recyclerview:recyclerview:1.3.1"
    implementation "androidx.cardview:cardview:1.0.0"
    implementation "androidx.fragment:fragment-ktx:1.6.1"
    implementation "androidx.swiperefreshlayout:swiperefreshlayout:1.1.0"
    implementation "com.squareup.okhttp3:okhttp:4.11.0"
}
